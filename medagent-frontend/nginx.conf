# ===== Nginx 服务器配置（前端独立部署时使用） =====
# 用于 MedAgent 前端项目的反向代理和静态文件服务

server {
    # 监听 80 端口（HTTP）
    listen 80;
    # 服务器名称
    server_name localhost;

    # ===== 静态资源根目录配置 =====
    root /usr/share/nginx/html;      # 前端构建产物所在的根目录
    index index.html;                # 默认首页文件名

    # ===== SPA 单页应用路由支持 =====
    # 根路径 "/"：所有前端路由请求由这里处理
    location / {
        # try_files 按顺序尝试查找文件：
        # $uri         —— 尝试直接匹配路径对应的文件（如 /about.html）
        # $uri/        —— 尝试匹配路径对应的目录
        # /index.html —— 以上都不存在则返回 index.html（由 React Router 接管前端路由）
        try_files $uri $uri/ /index.html;
    }

    # ===== API 反向代理 =====
    # 所有以 /api/ 开头的请求转发到后端 FastAPI 服务
    location /api/ {
        proxy_pass http://backend:8000/api/;               # 代理目标地址（Docker Compose 网络内）
        proxy_set_header Host $host;                        # 传递原始 Host 头
        proxy_set_header X-Real-IP $remote_addr;            # 传递客户端真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 传递代理链路 IP 列表
        proxy_set_header X-Forwarded-Proto $scheme;         # 传递请求协议（http/https）
        proxy_read_timeout 120s;                            # 响应读取超时时间（120 秒，支持 LLM 流式响应）
    }

    # ===== 静态资源缓存优化 =====
    # 对于 /static/ 下的资源（构建时带有内容哈希的文件名）启用强缓存
    location /static/ {
        expires 1y;                                         # 设置 Expires 头为 1 年后（强缓存）
        add_header Cache-Control "public, immutable";       # 标记为不可变缓存（浏览器无需重新验证）
    }
}
