x-app-environment: &app-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql://medagent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/medagent
  MYSQL_DATABASE_URL: mysql+pymysql://medagent:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@mysql:3306/medagent
  REDIS_URL: redis://redis:6379/0
  STANDARD_ANSWER_CACHE_ENABLED: "true"
  STANDARD_ANSWER_CACHE_TTL_SECONDS: ${STANDARD_ANSWER_CACHE_TTL_SECONDS:-21600}
  SESSION_MEMORY_BACKEND: mongodb
  MONGODB_URL: mongodb://${MONGO_USERNAME:-medagent}:${MONGO_PASSWORD:?set MONGO_PASSWORD}@mongo:27017/medagent?authSource=admin
  MONGODB_DATABASE: medagent
  MONGODB_REQUIRED: "true"
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY}
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.openai.com/v1/embeddings}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  UPLOAD_DIR: /app/uploads
  OCR_MODEL_DIR: /app/.easyocr/models
  DOCUMENT_QUALITY_ASSESSMENT_ENABLED: "false"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medagent
      MYSQL_USER: medagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: medagent
      POSTGRES_USER: medagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medagent -d medagent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-medagent}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_USERNAME:-medagent}", "--password", "${MONGO_PASSWORD:?set MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mysql: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    volumes:
      - upload_data:/app/uploads
      - ocr_model_data:/app/.easyocr/models
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build:
      context: ../medagent-frontend
    ports:
      - "3000:8080"
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  mongo_data:
  upload_data:
  ocr_model_data:
