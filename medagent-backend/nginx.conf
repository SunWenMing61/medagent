# ===== Nginx 反向代理服务器配置 =====
# 用于 MedAgent 项目的 API 网关和静态文件服务

# 定义一个服务器块（虚拟主机）
server {
    # 监听 80 端口（HTTP）
    listen 80;
    # 服务器名称（域名或 IP，localhost 表示本机）
    server_name localhost;

    # ===== 前端静态文件服务 =====
    # 根路径 "/" —— 所有请求默认由这里处理
    location / {
        root /usr/share/nginx/html;            # 前端构建产物存放目录（由 Dockerfile 复制而来）
        index index.html;                      # 默认首页文件名
        try_files $uri $uri/ /index.html;      # SPA 路由支持：尝试文件 -> 目录 -> 回退到 index.html
    }

    # ===== 后端 API 反向代理 =====
    # 所有以 /api/ 开头的请求转发到后端 FastAPI 服务
    location /api/ {
        proxy_pass http://backend:8000/api/;               # 将请求代理到 backend 容器的 8000 端口
        proxy_set_header Host $host;                        # 传递原始请求的 Host 头
        proxy_set_header X-Real-IP $remote_addr;            # 传递客户端真实 IP 地址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 传递完整的代理链路 IP 列表
        proxy_set_header X-Forwarded-Proto $scheme;         # 传递原始请求的协议（http/https）
        proxy_read_timeout 120s;                            # 从后端读取响应的超时时间（120 秒，适合长响应如 LLM 流式输出）
        proxy_connect_timeout 10s;                          # 与后端建立连接的超时时间（10 秒）
    }

    # ===== 后端健康检查 =====
    # /health 路径直接转发到后端健康检查接口
    location /health {
        proxy_pass http://backend:8000/health;              # 转发到后端健康检查端点
        proxy_set_header Host $host;                        # 传递 Host 头
    }
}
