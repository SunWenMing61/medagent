# ===== Pytest 配置文件 =====
# 配置 pytest 测试框架的默认行为

[pytest]
# 测试文件搜索路径：在 tests 目录下查找测试
testpaths = tests
# 测试文件匹配模式：匹配以 test_ 开头的 .py 文件
# 例如：test_api.py、test_utils.py 等
python_files = test_*.py
# 测试函数/方法匹配模式：匹配以 test_ 开头的函数名
# 例如：test_create_user()、test_search_documents() 等
python_functions = test_*
