# apiVersion: 指定 Kubernetes API 版本。v1 是核心 API 的稳定版本。
apiVersion: v1
# kind: 资源类型。Service 为 Redis Pod 提供稳定的网络访问端点。
kind: Service
# metadata: 资源的元数据信息。
metadata:
  # name: Service 的名称。其他服务通过此名称（如 redis:6379）访问 Redis 缓存。
  name: redis
  # namespace: 指定所属的命名空间。
  namespace: medagent
  # labels: 资源的标签，用于分类和选择。
  labels:
    # 遵循 Kubernetes 推荐标签规范，标记应用名称。
    app.kubernetes.io/name: medagent
    # 标记该组件为 Redis 缓存。
    app.kubernetes.io/component: redis
    # 标记所属系统。
    app.kubernetes.io/part-of: medagent
# spec: Service 的规格定义。
spec:
  # type: Service 类型。ClusterIP 仅在集群内部可访问。
  # Redis 缓存服务仅对内网应用开放，不需外部直接访问。
  type: ClusterIP
  # ports: Service 暴露的端口列表。
  ports:
    # - name: 端口名称。
    - name: redis
      # port: Service 对外暴露的端口号。
      port: 6379
      # targetPort: 转发到目标 Pod 的端口号，对应 Redis 容器监听的 6379 端口。
      targetPort: 6379
      # protocol: 网络协议，Redis 使用 TCP 协议。
      protocol: TCP
  # selector: 标签选择器，确定流量转发到哪些 Pod。
  selector:
    # 选择所有 app.kubernetes.io/component 为 redis 的 Pod。
    app.kubernetes.io/component: redis
