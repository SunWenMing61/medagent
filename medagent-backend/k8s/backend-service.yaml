# apiVersion: 指定 Kubernetes API 版本。v1 是核心 API 的稳定版本。
apiVersion: v1
# kind: 资源类型。Service 定义了一种访问 Pod 的逻辑抽象和策略，
# 为一组具有相同标签的 Pod 提供稳定的网络端点和服务发现。
kind: Service
# metadata: 资源的元数据信息。
metadata:
  # name: Service 的名称。集群内其他服务可通过此名称（作为 DNS 主机名）访问该 Service。
  name: backend
  # namespace: 指定所属的命名空间。
  namespace: medagent
  # labels: 资源的标签，用于分类和选择。
  labels:
    # 遵循 Kubernetes 推荐标签规范，标记应用名称。
    app.kubernetes.io/name: medagent
    # 标记该组件为后端服务。
    app.kubernetes.io/component: backend
    # 标记所属系统。
    app.kubernetes.io/part-of: medagent
# spec: Service 的规格定义。
spec:
  # type: Service 的类型。ClusterIP 表示该 Service 仅在集群内部可访问，
  # 通过 Kubernetes 内部的虚拟 IP 进行负载均衡，外部无法直接访问。
  type: ClusterIP
  # ports: Service 暴露的端口列表。定义了从 Service 到目标 Pod 的端口映射。
  ports:
    # - name: 端口的名称，用于在引用时增加可读性。
    - name: http
      # port: Service 对外暴露的端口号。其他服务通过此端口访问该 Service。
      port: 8000
      # targetPort: 流量将被转发到的目标 Pod 上的端口号。对应容器中应用监听的 8000 端口。
      targetPort: 8000
      # protocol: 端口使用的网络协议。默认为 TCP。
      protocol: TCP
  # selector: 标签选择器，用于确定哪些 Pod 属于该 Service 的后端。
  # Service 会将流量负载均衡到所有匹配此标签的 Pod。
  selector:
    # 选择 app.kubernetes.io/component 为 backend 的所有 Pod。
    app.kubernetes.io/component: backend
