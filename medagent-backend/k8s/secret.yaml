# apiVersion: 指定 Kubernetes API 的版本。v1 是核心 API 的稳定版本。
apiVersion: v1
# kind: 资源类型。Secret 用于存储敏感信息（如密码、API 密钥、证书），
# 以 Base64 编码形式存储，比直接写在配置中更安全。
kind: Secret
# metadata: 资源的元数据信息。
metadata:
  # name: Secret 的名称，在命名空间内唯一。其他资源通过此名称引用该 Secret。
  name: medagent-secrets
  # namespace: 指定所属的命名空间，与此 Secret 被引用的资源应在同一命名空间。
  namespace: medagent
  # labels: 资源的标签，用于分类和选择器匹配。
  labels:
    # 遵循 Kubernetes 推荐标签规范，标记应用名称。
    app.kubernetes.io/name: medagent
    # 遵循 Kubernetes 推荐标签规范，标记所属系统。
    app.kubernetes.io/part-of: medagent
# type: Secret 的类型。Opaque 表示不透明的键值对数据，是最通用的 Secret 类型。
type: Opaque
# data: 存放实际密钥数据的地方。所有值必须经过 Base64 编码。
data:
  # 下方各字段对应的 Base64 编码前的原文通过命令生成： echo -n 'change-this-in-production' | base64
  # SECRET_KEY: Django 或 Flask 等框架用于加密会话、CSRF 令牌等功能的密钥。生产环境必须替换为强随机字符串。
  SECRET_KEY: "Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbg=="
  # 下方 Base64 原文为 "placeholder"
  # LLM_API_KEY: 大语言模型（LLM）服务的 API 密钥，用于调用 GPT、Claude 等模型接口。
  LLM_API_KEY: "cGxhY2Vob2xkZXI="
  # EMBEDDING_API_KEY: 文本嵌入（Embedding）服务的 API 密钥，用于生成文本向量表示。
  EMBEDDING_API_KEY: "cGxhY2Vob2xkZXI="
  # 下方 Base64 原文为 "your-mysql-password-here"
  # mysql_password: MySQL 普通用户的数据库连接密码，由 medagent 用户使用。
  mysql_password: "eW91ci1teXNxbC1wYXNzd29yZC1oZXJl"
  # 下方 Base64 原文为 "your-mysql-root-password-here"
  # mysql_root_password: MySQL root 超级管理员的数据库密码，拥有最高权限。
  mysql_root_password: "eW91ci1teXNxbC1yb290LXBhc3N3b3JkLWhlcmU="
  # 下方 Base64 原文为 "your-postgres-password-here"
  # postgres_password: PostgreSQL 的连接密码，由 medagent 用户使用。
  postgres_password: "eW91ci1wb3N0Z3Jlcy1wYXNzd29yZC1oZXJl"
