apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: medagent
  labels:
    app.kubernetes.io/name: medagent
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: medagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medagent
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: medagent
    spec:
      containers:
        - name: frontend
          image: medagent-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
