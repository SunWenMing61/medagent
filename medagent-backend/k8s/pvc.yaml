# --- 第一个 PVC: PostgreSQL 数据持久卷声明 ---
# apiVersion: Kubernetes API 版本。v1 是核心 API 的稳定版本。
apiVersion: v1
# kind: 资源类型。PersistentVolumeClaim（PVC）用于声明持久化存储需求，
# Kubernetes 会自动或手动绑定一个满足条件的 PersistentVolume（PV）。
kind: PersistentVolumeClaim
# metadata: 资源的元数据信息。
metadata:
  # name: PVC 的名称，用于被 Pod 通过 volumes 引用。
  name: postgres-data
  # namespace: 指定所属命名空间，PVC 是命名空间级别的资源。
  namespace: medagent
  # labels: 资源标签，用于分类和选择。
  labels:
    # 遵循 Kubernetes 推荐标签规范，标记应用名称。
    app.kubernetes.io/name: medagent
    # 标记该组件为 PostgreSQL 数据库。
    app.kubernetes.io/component: postgres
    # 标记所属系统。
    app.kubernetes.io/part-of: medagent
# spec: 定义存储的规格需求。
spec:
  # accessModes: 存储卷的访问模式。
  # ReadWriteOnce: 表示该卷可以被单个节点以读写方式挂载。
  accessModes:
    - ReadWriteOnce
  # resources: 定义存储资源的请求量。
  resources:
    # requests: 声明所需的最小存储空间大小。
    requests:
      # storage: 请求 10GiB 的磁盘空间用于 PostgreSQL 数据文件存储。
      storage: 10Gi
  # storageClassName: 指定存储类名称。StorageClass 定义了动态制备 PV 的存储后端类型（如 SSD、HDD、云存储等）。
  storageClassName: standard
---
# --- 第二个 PVC: 上传文件持久卷声明 ---
# apiVersion: Kubernetes API 版本。
apiVersion: v1
# kind: 持久卷声明资源，用于存储用户上传的文档文件。
kind: PersistentVolumeClaim
# metadata: 资源元数据。
metadata:
  # name: 上传文件数据卷的名称。
  name: uploads-data
  # namespace: 所属命名空间。
  namespace: medagent
  # labels: 资源标签。
  labels:
    # 应用名称标签。
    app.kubernetes.io/name: medagent
    # 标记该组件为上传文件存储。
    app.kubernetes.io/component: uploads
    # 所属系统标签。
    app.kubernetes.io/part-of: medagent
# spec: 存储规格定义。
spec:
  # accessModes: 访问模式，仅允许单个节点读写。
  accessModes:
    - ReadWriteOnce
  # resources: 存储资源配置。
  resources:
    # requests: 请求的最小存储空间。
    requests:
      # storage: 请求 5GiB 的磁盘空间用于存放用户上传的文档。
      storage: 5Gi
  # storageClassName: 使用名为 "standard" 的 StorageClass。
  storageClassName: standard
