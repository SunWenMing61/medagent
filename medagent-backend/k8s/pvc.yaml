apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: medagent
  labels:
    app.kubernetes.io/name: medagent
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: medagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: medagent
  labels:
    app.kubernetes.io/name: medagent
    app.kubernetes.io/component: uploads
    app.kubernetes.io/part-of: medagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
