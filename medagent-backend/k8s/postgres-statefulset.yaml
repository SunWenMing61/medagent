apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: medagent
  labels:
    app.kubernetes.io/name: medagent
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: medagent
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medagent
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: medagent
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "medagent"
            - name: POSTGRES_PASSWORD
              value: "medagent123"
            - name: POSTGRES_DB
              value: "medagent"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - medagent
                - -d
                - medagent
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - medagent
                - -d
                - medagent
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: medagent
          app.kubernetes.io/component: postgres
          app.kubernetes.io/part-of: medagent
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
