# apiVersion: 指定 Kubernetes API 版本。v1 是核心 API 的稳定版本。
apiVersion: v1
# kind: 资源类型。Service 为 PostgreSQL Pod 提供稳定的网络访问端点。
kind: Service
# metadata: 资源的元数据信息。
metadata:
  # name: Service 的名称。其他服务通过此名称（如 postgres:5432）访问 PostgreSQL。
  name: postgres
  # namespace: 指定所属的命名空间。
  namespace: medagent
  # labels: 资源的标签，用于分类和选择。
  labels:
    # 遵循 Kubernetes 推荐标签规范，标记应用名称。
    app.kubernetes.io/name: medagent
    # 标记该组件为 PostgreSQL 数据库。
    app.kubernetes.io/component: postgres
    # 标记所属系统。
    app.kubernetes.io/part-of: medagent
# spec: Service 的规格定义。
spec:
  # type: Service 类型。ClusterIP 仅在集群内部可访问。
  # PostgreSQL 数据库不直接对外部暴露，由内部应用通过集群网络访问。
  type: ClusterIP
  # ports: Service 暴露的端口列表。
  ports:
    # - name: 端口名称。
    - name: postgres
      # port: Service 对外暴露的端口号。
      port: 5432
      # targetPort: 转发到目标 Pod 的端口号，对应 PostgreSQL 监听端口 5432。
      targetPort: 5432
      # protocol: 网络协议，PostgreSQL 使用 TCP 协议通信。
      protocol: TCP
  # selector: 标签选择器，确定流量转发到哪些 Pod。
  selector:
    # 选择所有 app.kubernetes.io/component 为 postgres 的 Pod。
    app.kubernetes.io/component: postgres
