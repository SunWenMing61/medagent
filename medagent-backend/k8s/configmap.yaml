apiVersion: v1
kind: ConfigMap
metadata:
  name: medagent-config
  namespace: medagent
  labels:
    app.kubernetes.io/name: medagent
    app.kubernetes.io/part-of: medagent
data:
  # Sensitive values should be overridden via environment variables or K8s Secrets
  DATABASE_URL: "postgresql://medagent:${POSTGRES_PASSWORD}@postgres:5432/medagent"
  MYSQL_DATABASE_URL: "mysql+pymysql://medagent:${MYSQL_PASSWORD}@mysql:3306/medagent"
  REDIS_URL: "redis://redis:6379/0"
  LLM_MODEL: "gpt-4o-mini"
  EMBEDDING_MODEL: "text-embedding-3-small"
  TOP_K: "5"
  SIMILARITY_THRESHOLD: "0.5"
  UPLOAD_DIR: "/app/uploads"
