# ===== Alembic 数据库迁移配置文件 =====
# Alembic 是 SQLAlchemy 的数据库迁移工具，用于管理数据库 schema 版本变更

# [alembic] 核心配置段
[alembic]
# 脚本位置：存放迁移脚本的目录（包含 env.py 和版本迁移文件）
script_location = alembic
# 数据库连接字符串
# 使用 PostgreSQL，通过环境变量 ${POSTGRES_PASSWORD} 动态注入密码
# 格式：postgresql://用户名:密码@主机:端口/数据库名
sqlalchemy.url = postgresql://medagent:${POSTGRES_PASSWORD}@localhost:5432/medagent

# 日志记录器配置
[loggers]
keys = root,sqlalchemy,alembic      # 定义了 3 个日志记录器：根记录器、SQLAlchemy 引擎记录器、Alembic 记录器

# 日志处理器配置
[handlers]
keys = console                      # 只使用控制台输出处理器（打印到终端）

# 日志格式化器配置
[formatters]
keys = generic                      # 使用通用格式

# 根日志记录器配置（所有日志的默认设置）
[logger_root]
level = WARN                        # 日志级别：WARN（仅记录警告和错误，不输出 INFO 级别的调试信息）
handlers = console                  # 关联的控制台处理器

# SQLAlchemy 引擎日志记录器配置（记录数据库执行的 SQL 语句等）
[logger_sqlalchemy]
level = WARN                        # 只记录 SQLAlchemy 的警告和错误（不输出 SQL 语句，保持输出整洁）
handlers =                          # 不指定独立处理器，继承根记录器的处理器
qualname = sqlalchemy.engine        # Python 包限定名，用于匹配 SQLAlchemy 的日志命名空间

# Alembic 迁移日志记录器配置（记录迁移执行过程）
[logger_alembic]
level = INFO                        # 级别为 INFO，输出迁移相关的信息（如 "Running upgrade..."）
handlers =                          # 不指定独立处理器，继承根记录器的处理器
qualname = alembic                  # Python 包限定名，匹配 alembic 包内部的日志

# 控制台日志处理器配置
[handler_console]
class = StreamHandler               # 使用 Python 标准库的 StreamHandler（输出到流）
args = (sys.stderr,)                # 输出到标准错误流 stderr（而非 stdout）
level = NOTSET                      # 不设级别限制，由关联的记录器决定
formatter = generic                 # 关联的格式化器名称

# 通用日志格式化器配置
[formatter_generic]
# 日志消息格式：
# %(levelname)-5.5s —— 日志级别名称，左对齐，固定宽度 5 字符（如 "WARN "、"INFO "）
# [%(name)s] —— 记录器名称（如 alembic、sqlalchemy.engine）
# %(message)s —— 实际的日志消息内容
format = %(levelname)-5.5s [%(name)s] %(message)s
# 时间格式：时:分:秒（如 14:30:25）
datefmt = %H:%M:%S
